name: Cinema Telegram Bot

on:
  workflow_dispatch:

concurrency:
  group: cinema-telegram-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          pip install -r requirements.txt

      - name: Check Telegram messages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python cinema_telegram.py

      - name: Save Telegram state
        run: |
          if [ -f telegram_state.json ]; then
            git config user.name "cinema-telegram-bot"
            git config user.email "github-actions@users.noreply.github.com"

            git add telegram_state.json

            if ! git diff --cached --quiet; then
              git commit -m "Update Telegram state"
              git push
            fi
          fi
